<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head(~{::title})}">
    <title>Cập Nhật Sản Phẩm</title>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-lg bg-slate-900/90 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl p-6 sm:p-8 space-y-6">

    <!-- Gọi Header Fragment cho Trang Chỉnh Sửa -->
    <div th:replace="~{fragments/form-fragments :: cardHeader(
        'fa-solid fa-pen-to-square',
        'bg-amber-600/20',
        'text-amber-400',
        'border-amber-500/30',
        'Chỉnh Sửa Sản Phẩm',
        'Thay đổi thông tin chi tiết sản phẩm'
    )}"></div>

    <!-- Gọi Form Fragment: action=/products/update, submitText='Cập nhật', isEdit=true -->
    <form th:replace="~{fragments/form-fragments :: productForm(
        @{/products/update},
        'Cập nhật',
        'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-amber-500/25',
        true
    )}"></form>

</div>

</body>
</html>
