<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Quản Lý Sản Phẩm</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body>

<!-- Fragment hiển thị thông báo thành công / thất bại dùng chung -->
<div th:fragment="alerts" class="space-y-3">
    <div th:if="${success}" class="p-4 bg-emerald-950/80 border border-emerald-500/40 rounded-2xl text-emerald-300 text-sm flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="p-4 bg-rose-950/80 border border-rose-500/40 rounded-2xl text-rose-300 text-sm flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-rose-400"></i>
        <span th:text="${error}"></span>
    </div>
</div>

</body>
</html>
