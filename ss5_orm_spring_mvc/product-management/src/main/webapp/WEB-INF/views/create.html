<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head(~{::title})}">
    <title>Thêm Sản Phẩm Mới</title>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-lg bg-slate-900/90 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl p-6 sm:p-8 space-y-6">

    <!-- Gọi Header Fragment cho Trang Tạo Mới -->
    <div th:replace="~{fragments/form-fragments :: cardHeader(
        'fa-solid fa-shirt',
        'bg-indigo-600/20',
        'text-indigo-400',
        'border-indigo-500/30',
        'Thêm Sản Phẩm Mới',
        'Nhập thông tin mẫu quần áo mới vào hệ thống'
    )}"></div>

    <!-- Gọi Form Fragment: action=/products/save, submitText='Lưu sản phẩm', isEdit=false -->
    <form th:replace="~{fragments/form-fragments :: productForm(
        @{/products/save},
        'Lưu sản phẩm',
        'bg-indigo-600 hover:bg-indigo-500 shadow-indigo-600/25',
        false
    )}"></form>

</div>

</body>
</html>
