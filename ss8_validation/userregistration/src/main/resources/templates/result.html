<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Thành Công</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center">
    <div class="text-green-500 text-5xl mb-4">✓</div>
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Đăng Ký Thành Công!</h2>
    <p class="text-gray-600 mb-6">Thông tin người dùng đã được lưu vào hệ thống thành công.</p>

    <div class="bg-gray-50 p-4 rounded text-left space-y-2 mb-6 border">
        <p><strong>First Name:</strong> <span th:text="${user.firstName}"></span></p>
        <p><strong>Last Name:</strong> <span th:text="${user.lastName}"></span></p>
        <p><strong>Phone Number:</strong> <span th:text="${user.phoneNumber}"></span></p>
        <p><strong>Age:</strong> <span th:text="${user.age}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
    </div>

    <a th:href="@{/}" class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Quay lại trang Đăng ký
    </a>
</div>
</body>
</html>
