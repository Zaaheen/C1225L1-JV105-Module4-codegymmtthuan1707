<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Cấu Hình Hòm Thư</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl p-6 sm:p-8 space-y-6">

    <!-- Header -->
    <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-sky-600/20 text-sky-400 border border-sky-500/30">
            <i class="fa-solid fa-sliders text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Chỉnh Sửa Cấu Hình</h1>
        <p class="text-xs text-slate-400">Thay đổi các thuộc tính hòm thư điện tử</p>
    </div>

    <!-- Form Binding Spring MVC & Thymeleaf -->
    <form th:action="@{/config/update}" th:object="${config}" method="post" class="space-y-4">

        <!-- Language Select -->
        <div class="space-y-1.5">
            <label for="language" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                Ngôn ngữ (Languages)
            </label>
            <select id="language" th:field="*{language}"
                    class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                <option th:each="lang : ${languages}" th:value="${lang}" th:text="${lang}"></option>
            </select>
        </div>

        <!-- Page Size Select -->
        <div class="space-y-1.5">
            <label for="pageSize" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                Số email hiển thị / trang (Page Size)
            </label>
            <select id="pageSize" th:field="*{pageSize}"
                    class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                <option th:each="size : ${pageSizes}" th:value="${size}" th:text="${size} + ' emails per page'"></option>
            </select>
        </div>

        <!-- Spams Filter Checkbox -->
        <div class="pt-2">
            <label class="flex items-center gap-3 p-3 bg-slate-800/50 border border-slate-700/60 rounded-xl cursor-pointer hover:bg-slate-800 transition">
                <input type="checkbox" th:field="*{spamsFilter}"
                       class="w-5 h-5 rounded border-slate-600 text-sky-500 focus:ring-sky-500/30 bg-slate-900">
                <div class="text-xs">
                    <span class="font-bold text-slate-200 block">Enable spams filter</span>
                    <span class="text-slate-400">Tự động chuyển thư nghi vấn rác vào hòm Spams</span>
                </div>
            </label>
        </div>

        <!-- Signature Textarea -->
        <div class="space-y-1.5">
            <label for="signature" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                Chữ ký email (Signature)
            </label>
            <textarea id="signature" th:field="*{signature}" rows="3"
                      placeholder="Nhập chữ ký..."
                      class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 font-mono"></textarea>
        </div>

        <!-- Form Action Buttons -->
        <div class="flex gap-3 pt-2">
            <a th:href="@{/config}"
               class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl text-center text-sm border border-slate-700 transition">
                Hủy bỏ
            </a>
            <button type="submit"
                    class="w-1/2 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-sky-500/25">
                Lưu thay đổi
            </button>
        </div>

    </form>

</div>

</body>
</html>
