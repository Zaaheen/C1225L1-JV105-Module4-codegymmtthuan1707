<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trả Sách Thư Viện</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

<nav class="bg-indigo-700 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <a th:href="@{/library}" class="text-xl font-bold tracking-wide">📚 Thư Viện Sách Số</a>
        <a th:href="@{/library/books}" class="text-indigo-200 hover:text-white font-medium text-sm">Trang Chủ</a>
    </div>
</nav>

<main class="max-w-md mx-auto px-4 py-12 flex-grow w-full">
    <div class="bg-white p-8 rounded-xl shadow-lg border">

        <!-- THÔNG BÁO TRẢ SÁCH THÀNH CÔNG (Hiển thị khi returnedTicketCode != null) -->
        <div th:if="${returnedTicketCode}" class="text-center mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
            <div class="text-3xl mb-1">↩️</div>
            <h2 class="text-xl font-bold text-blue-800 mb-1">Trả Sách Thành Công!</h2>
            <p class="text-sm text-gray-600">Mã phiếu <strong class="font-mono text-indigo-600" th:text="${returnedTicketCode}"></strong> đã được vô hiệu hóa. Sách đã về kho.</p>
        </div>

        <!-- FORM NHẬP MÃ TRẢ SÁCH -->
        <h1 class="text-2xl font-extrabold text-gray-800 text-center mb-2">Trả Sách Thư Viện</h1>
        <p class="text-gray-500 text-xs text-center mb-6">Nhập mã mượn 5 chữ số được cấp khi bạn mượn sách.</p>

        <form th:action="@{/library/return}" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Mã mượn sách (5 chữ số):</label>
                <input type="text" name="ticketCode" required maxlength="5" pattern="[0-9]{5}" placeholder="Ví dụ: 04829"
                       class="w-full px-4 py-3 border rounded-lg text-center text-2xl font-mono tracking-widest focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-lg transition shadow">
                Xác Nhận Hoàn Trả Sách
            </button>
        </form>

        <div class="mt-6 text-center">
            <a th:href="@{/library/books}" class="text-xs text-gray-500 hover:underline">&larr; Hủy và về trang chủ</a>
        </div>
    </div>
</main>

<footer class="bg-gray-800 text-gray-400 py-4 text-center text-xs mt-12">
    <p>© 2026 Library Management System.</p>
</footer>
</body>
</html>
