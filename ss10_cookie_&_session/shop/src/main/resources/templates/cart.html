<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giỏ Hàng Của Bạn</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 min-h-screen">
<div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border">

    <!-- Thanh Tab Tiến Trình -->
    <div class="flex border-b text-center font-bold text-sm">
        <div class="w-1/3 py-3 bg-cyan-500 text-white flex items-center justify-center gap-2">
            <span>01. Giỏ hàng</span>
        </div>
        <div class="w-1/3 py-3 bg-gray-100 text-gray-500">02. Đơn hàng</div>
        <div class="w-1/3 py-3 bg-gray-100 text-gray-500">03. Thanh toán</div>
    </div>

    <div class="p-6">
        <div class="flex justify-between items-center border-b pb-3 mb-4">
            <h2 class="text-xl font-bold text-gray-800">
                GIỎ HÀNG (<span th:text="${cart.countProductQuantity()}">0</span>)
            </h2>
            <a th:href="@{/shop}" class="text-xs text-blue-600 hover:underline">+ Tiếp tục mua hàng</a>
        </div>

        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 p-3 rounded mb-4 text-sm" th:text="${error}"></div>

        <!-- Trường hợp Giỏ trống -->
        <div th:if="${#maps.isEmpty(cart.products)}" class="text-center py-12 text-gray-500">
            <p class="text-lg mb-4">Giỏ hàng của bạn chưa có sản phẩm nào.</p>
            <a th:href="@{/shop}" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold">Xem Danh Sách Sản Phẩm</a>
        </div>

        <!-- Danh Sách Vật Phẩm -->
        <div th:each="entry : ${cart.products}" class="flex items-center border-b py-4">
            <!-- Nút Xóa -->
            <a th:href="@{/cart/remove/{id}(id=${entry.key.id})}"
               onclick="return confirm('Bạn muốn xóa sản phẩm này khỏi giỏ hàng?')"
               class="bg-cyan-600 hover:bg-cyan-700 text-white px-3 py-1 font-extrabold text-sm mr-4 rounded shadow">✕</a>

            <!-- Hình ảnh -->
            <img th:src="${entry.key.image}" class="w-20 h-20 object-cover rounded-md border mr-6">

            <!-- Thông tin & Số lượng -->
            <div class="flex-grow">
                <h3 class="text-red-700 font-bold text-lg" th:text="${entry.key.name}"></h3>
                <p class="text-xs text-gray-500 mb-1">Mã SP: <span class="text-green-600 font-bold" th:text="${entry.key.code}"></span></p>
                <p class="text-sm font-semibold text-gray-700">
                    Đơn giá: <span class="text-gray-900" th:text="${#numbers.formatDecimal(entry.key.newPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                </p>

                <!-- Form Thay Đổi Số Lượng -->
                <form th:action="@{/cart/update}" method="post" class="mt-2 flex items-center gap-2">
                    <input type="hidden" name="id" th:value="${entry.key.id}">
                    <label class="text-xs font-semibold text-gray-600">Số lượng:</label>
                    <select name="quantity" onchange="this.form.submit()" class="border px-3 py-1 rounded bg-white text-sm focus:ring-2 focus:ring-cyan-500">
                        <option th:each="i : ${#numbers.sequence(1, 10)}"
                                th:value="${i}"
                                th:text="${i}"
                                th:selected="${i == entry.value}">
                        </option>
                    </select>
                </form>
            </div>
        </div>

        <!-- Tổng Tiền & Nút Thanh Toán -->
        <div th:if="${!#maps.isEmpty(cart.products)}" class="mt-6 flex flex-col sm:flex-row justify-between items-center pt-4 border-t gap-4">
            <div class="text-xl font-bold text-gray-800">
                Tổng cộng: <span class="text-red-600 font-black text-2xl" th:text="${#numbers.formatDecimal(cart.countTotalAmount(), 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
            </div>

            <form th:action="@{/cart/checkout}" method="post">
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-extrabold px-8 py-3 rounded-lg shadow-md transition uppercase">
                    Tiến hành Thanh toán
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
