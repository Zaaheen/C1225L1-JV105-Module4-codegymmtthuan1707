<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing ? 'Cập nhật câu hỏi' : 'Thêm câu hỏi'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/question.css}">
</head>
<body>
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-4" th:text="${editing ? 'Cập nhật câu hỏi' : 'Thêm câu hỏi'}"></h1>

                        <form method="post" th:action="@{/questions/save}" th:object="${question}">
                            <input type="hidden" th:field="*{id}">

                            <!-- Trường tiêu đề -->
                            <div class="mb-3">
                                <label class="form-label" for="title">Tiêu đề</label>
                                <input class="form-control" id="title" th:field="*{title}" maxlength="100">
                                <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>

                            <!-- Trường loại câu hỏi -->
                            <div class="mb-3">
                                <label class="form-label" for="questionTypeId">Loại câu hỏi</label>
                                <select class="form-select" id="questionTypeId" th:field="*{questionTypeId}">
                                    <option value="">-- Chọn loại câu hỏi --</option>
                                    <option th:each="type : ${questionTypes}" th:value="${type.id}" th:text="${type.name}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('questionTypeId')}" th:errors="*{questionTypeId}"></div>
                            </div>

                            <!-- Trường nội dung -->
                            <div class="mb-4">
                                <label class="form-label" for="content">Nội dung</label>
                                <textarea class="form-control" id="content" rows="6" maxlength="500" th:field="*{content}"></textarea>
                                <div class="text-danger small" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                            </div>

                            <!-- Nút thao tác -->
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit" th:text="${editing ? 'Lưu thay đổi' : 'Tạo câu hỏi'}"></button>
                                <a class="btn btn-outline-secondary" th:href="@{/questions}">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
