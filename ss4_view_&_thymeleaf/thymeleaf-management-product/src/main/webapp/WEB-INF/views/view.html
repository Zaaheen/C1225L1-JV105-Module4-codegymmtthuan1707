<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head(~{::title})}">
    <title>Chi Tiết Sản Phẩm</title>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl p-6 sm:p-8 space-y-6">

    <!-- Gọi Header Fragment -->
    <div th:replace="~{fragments/form-fragments :: cardHeader(
        'fa-solid fa-circle-info',
        'bg-sky-600/20',
        'text-sky-400',
        'border-sky-500/30',
        'Chi Tiết Sản Phẩm',
        'Xem toàn bộ thông tin chi tiết sản phẩm'
    )}"></div>

    <div class="space-y-4 text-sm bg-slate-800/50 p-5 rounded-2xl border border-slate-700/60">
        <div class="border-b border-slate-700/60 pb-3">
            <span class="text-slate-400 text-xs uppercase font-semibold block mb-1">Tên quần áo / sản phẩm</span>
            <span class="text-lg font-bold text-white" th:text="${product.name}"></span>
        </div>

        <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
            <span class="text-slate-400 text-xs uppercase font-semibold">Thương hiệu</span>
            <span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30"
                  th:text="${product.manufacturer}"></span>
        </div>

        <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
            <span class="text-slate-400 text-xs uppercase font-semibold">Giá niêm yết</span>
            <span class="text-lg font-extrabold text-emerald-400"
                  th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
        </div>

        <div>
            <span class="text-slate-400 text-xs uppercase font-semibold block mb-1">Mô tả sản phẩm</span>
            <p class="p-3 bg-slate-900/80 rounded-xl text-slate-300 text-xs border border-slate-800 leading-relaxed"
               th:text="${product.description}"></p>
        </div>
    </div>

    <div class="flex gap-3">
        <a th:href="@{/products}"
           class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl text-center text-sm border border-slate-700 transition">
            Quay lại
        </a>
        <a th:href="@{/products/{id}/edit(id=${product.id})}"
           class="w-1/2 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2.5 px-4 rounded-xl text-center text-sm transition shadow-lg shadow-sky-500/25">
            Sửa sản phẩm
        </a>
    </div>

</div>

</body>
</html>
