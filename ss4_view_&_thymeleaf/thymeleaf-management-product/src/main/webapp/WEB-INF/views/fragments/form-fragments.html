<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 1. Parameterized Fragment: Card Header (Icon + Title + Subtitle) -->
<div th:fragment="cardHeader(iconClass, bgStyle, textStyle, borderStyle, title, subtitle)" class="text-center space-y-2">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl border"
         th:classappend="${bgStyle} + ' ' + ${textStyle} + ' ' + ${borderStyle}">
        <i th:class="${iconClass} + ' text-2xl'"></i>
    </div>
    <h1 class="text-2xl font-bold text-white" th:text="${title}">Tiêu đề</h1>
    <p class="text-xs text-slate-400" th:text="${subtitle}">Mô tả ngắn</p>
</div>

<!-- 2. Parameterized Fragment: Reusable Product Form (Dùng chung cho Create & Update) -->
<form th:fragment="productForm(actionUrl, submitText, btnBgClass, isEdit)"
      th:action="${actionUrl}" th:object="${product}" method="post" class="space-y-4">

    <!-- Nếu là trang Edit thì render hidden ID -->
    <input th:if="${isEdit}" type="hidden" th:field="*{id}" />

    <!-- Tên sản phẩm -->
    <div class="space-y-1.5">
        <label for="name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Tên sản phẩm</label>
        <input type="text" id="name" th:field="*{name}" required placeholder="Ví dụ: Áo Sơ Mi Oxford"
               class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <!-- Giá & Thương hiệu -->
    <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1.5">
            <label for="price" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Giá bán (VNĐ)</label>
            <input type="number" step="1000" id="price" th:field="*{price}" required placeholder="450000"
                   class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="space-y-1.5">
            <label for="manufacturer" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Thương hiệu</label>
            <input type="text" id="manufacturer" th:field="*{manufacturer}" required placeholder="Uniqlo, Zara, Routine..."
                   class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
    </div>

    <!-- Mô tả -->
    <div class="space-y-1.5">
        <label for="description" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Mô tả sản phẩm</label>
        <textarea id="description" th:field="*{description}" rows="3" placeholder="Chất liệu, kiểu dáng, hướng dẫn bảo quản..."
                  class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
    </div>

    <!-- Nút thao tác -->
    <div class="flex gap-3 pt-2">
        <a th:href="@{/products}"
           class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl text-center text-sm border border-slate-700 transition">
            Hủy bỏ
        </a>
        <button type="submit"
                class="w-1/2 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition shadow-lg"
                th:classappend="${btnBgClass}"
                th:text="${submitText}">
            Lưu
        </button>
    </div>

</form>

</body>
</html>
