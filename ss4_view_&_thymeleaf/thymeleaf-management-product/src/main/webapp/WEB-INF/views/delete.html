<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head(~{::title})}">
    <title>Xác Nhận Xóa Sản Phẩm</title>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl p-6 sm:p-8 space-y-6">

    <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-rose-600/20 text-rose-400 border border-rose-500/30">
            <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Xác Nhận Xóa</h1>
        <p class="text-xs text-slate-400">Bạn có chắc chắn muốn xóa sản phẩm này không?</p>
    </div>

    <div class="p-4 bg-slate-800/60 rounded-2xl border border-slate-700/60 space-y-2 text-sm">
        <div class="flex justify-between">
            <span class="text-slate-400">Tên sản phẩm:</span>
            <span class="font-bold text-white" th:text="${product.name}"></span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-400">Thương hiệu:</span>
            <span class="text-indigo-300" th:text="${product.manufacturer}"></span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-400">Giá bán:</span>
            <span class="text-emerald-400 font-bold" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
        </div>
    </div>

    <form th:action="@{/products/delete}" th:object="${product}" method="post" class="flex gap-3">
        <input type="hidden" th:field="*{id}" />
        <a th:href="@{/products}"
           class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl text-center text-sm border border-slate-700 transition">
            Hủy bỏ
        </a>
        <button type="submit"
                class="w-1/2 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-rose-600/25">
            Xác nhận xóa
        </button>
    </form>

</div>

</body>
</html>
