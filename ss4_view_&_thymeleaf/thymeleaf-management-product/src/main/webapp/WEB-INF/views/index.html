<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout :: head(~{::title})}">
    <title>Danh Sách Sản Phẩm Thời Trang</title>
</head>
<body class="min-h-screen p-4 sm:p-8">

<div class="max-w-6xl mx-auto space-y-6">

    <!-- Header Trang Index -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/90 backdrop-blur-xl p-6 rounded-3xl border border-slate-800 shadow-xl">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-xl">
                <i class="fa-solid fa-shirt"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">Quản Lý Sản Phẩm Thời Trang</h1>
                <p class="text-xs text-slate-400">Danh sách các mặt hàng quần áo và thời trang cao cấp</p>
            </div>
        </div>

        <a th:href="@{/products/create}"
           class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition flex items-center gap-2 shadow-lg shadow-indigo-600/25">
            <i class="fa-solid fa-plus"></i>
            <span>Thêm sản phẩm mới</span>
        </a>
    </div>

    <!-- Nhúng Fragment Thông báo Alert từ layout.html -->
    <div th:replace="~{layout :: alerts}"></div>

    <!-- Thanh tìm kiếm -->
    <form th:action="@{/products}" method="get" class="flex gap-3">
        <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" name="search" th:value="${search}"
                   placeholder="Nhập tên sản phẩm quần áo cần tìm..."
                   class="w-full pl-11 pr-4 py-3 bg-slate-900/80 border border-slate-800 rounded-2xl text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
                class="px-5 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl text-sm font-medium border border-slate-700 transition">
            Tìm kiếm
        </button>
        <a th:if="${search != null}" th:href="@{/products}"
           class="px-4 py-3 bg-slate-800/50 hover:bg-slate-800 text-slate-400 hover:text-slate-200 rounded-2xl text-sm border border-slate-800 flex items-center">
            Xóa bộ lọc
        </a>
    </form>

    <!-- Bảng sản phẩm -->
    <div class="bg-slate-900/90 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-slate-800/60 text-xs font-semibold uppercase text-slate-400 border-b border-slate-800">
                <tr>
                    <th class="py-4 px-6">ID</th>
                    <th class="py-4 px-6">Tên sản phẩm</th>
                    <th class="py-4 px-6">Thương hiệu</th>
                    <th class="py-4 px-6">Giá bán</th>
                    <th class="py-4 px-6 text-center">Hành động</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
                <tr th:each="product : ${products}" class="hover:bg-slate-800/40 transition">
                    <td class="py-4 px-6 font-mono text-xs text-slate-500" th:text="'#' + ${product.id}"></td>
                    <td class="py-4 px-6 font-semibold text-white" th:text="${product.name}"></td>
                    <td class="py-4 px-6">
                        <span class="px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800 text-indigo-300 border border-slate-700"
                              th:text="${product.manufacturer}"></span>
                    </td>
                    <td class="py-4 px-6 font-bold text-emerald-400"
                        th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                    <td class="py-4 px-6">
                        <div class="flex justify-center items-center gap-2">
                            <a th:href="@{/products/{id}/view(id=${product.id})}"
                               class="p-2 text-sky-400 hover:bg-sky-500/10 rounded-lg transition" title="Xem chi tiết">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                            <a th:href="@{/products/{id}/edit(id=${product.id})}"
                               class="p-2 text-amber-400 hover:bg-amber-500/10 rounded-lg transition" title="Chỉnh sửa">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>
                            <a th:href="@{/products/{id}/delete(id=${product.id})}"
                               class="p-2 text-rose-400 hover:bg-rose-500/10 rounded-lg transition" title="Xóa">
                                <i class="fa-solid fa-trash-can"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="5" class="py-12 text-center text-slate-500">
                        <i class="fa-solid fa-box-open text-4xl mb-3 block text-slate-600"></i>
                        Không tìm thấy sản phẩm quần áo nào phù hợp!
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
