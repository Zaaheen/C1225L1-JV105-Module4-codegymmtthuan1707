<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Bài Viết</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <a th:href="@{/blogs}" class="text-blue-600 hover:underline text-sm font-medium mb-4 inline-block">&larr; Quay lại danh sách</a>

    <h1 class="text-3xl font-extrabold text-gray-900 mb-2" th:text="${blog.title}">Tiêu đề bài viết</h1>

    <div class="flex items-center text-sm text-gray-500 mb-6 pb-4 border-b">
        <span>Tác giả: <strong th:text="${blog.author}"></strong></span>
        <span class="mx-2">•</span>
        <span>Đăng lúc: <span th:text="${#temporals.format(blog.createdAt, 'dd/MM/yyyy HH:mm')}"></span></span>
    </div>

    <div class="bg-gray-50 p-4 border-l-4 border-blue-500 italic text-gray-700 mb-6">
        <p th:text="${blog.summary}"></p>
    </div>

    <div class="prose max-w-none text-gray-800 leading-relaxed whitespace-pre-line" th:text="${blog.content}">
        Nội dung đầy đủ của bài viết...
    </div>

    <div class="mt-8 pt-4 border-t flex space-x-4">
        <a th:href="@{/blogs/edit/{id}(id=${blog.id})}" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded font-medium">Chỉnh sửa</a>
        <a th:href="@{/blogs/delete/{id}(id=${blog.id})}" onclick="return confirm('Bạn có chắc muốn xóa bài viết này?')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-medium">Xóa bài viết</a>
    </div>
</div>
</body>
</html>
