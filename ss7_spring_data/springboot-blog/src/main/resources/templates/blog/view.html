<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title th:text="${blog.title}">Chi Tiết Bài Viết</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <div class="mb-4">
            <span class="bg-blue-100 text-blue-800 font-semibold px-3 py-1 rounded text-sm"
                  th:text="${blog.category != null ? blog.category.name : 'Chưa phân loại'}">Danh mục</span>
    </div>

    <h1 class="text-3xl font-bold text-gray-900 mb-3" th:text="${blog.title}">Tiêu đề bài viết</h1>

    <div class="text-sm text-gray-500 border-b pb-4 mb-6">
        Đăng bởi <span class="font-medium text-gray-800" th:text="${blog.author}">Tác giả</span>
        vào lúc <span th:text="${#temporals.format(blog.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
    </div>

    <div class="bg-gray-50 p-4 border-l-4 border-blue-500 italic text-gray-700 mb-6" th:text="${blog.summary}">
        Nội dung tóm tắt...
    </div>

    <div class="text-gray-800 whitespace-pre-line leading-relaxed mb-8" th:text="${blog.content}">
        Nội dung chi tiết bài viết...
    </div>

    <div class="flex justify-between border-t pt-4">
        <a th:href="@{/blogs}" class="text-blue-600 hover:underline font-medium">&larr; Quay lại danh sách</a>
        <div class="space-x-2">
            <a th:href="@{/blogs/edit/{id}(id=${blog.id})}" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded text-sm">Sửa bài</a>
            <a th:href="@{/blogs/delete/{id}(id=${blog.id})}" onclick="return confirm('Bạn có chắc muốn xóa bài viết này?')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">Xóa bài</a>
        </div>
    </div>
</div>
</body>
</html>
