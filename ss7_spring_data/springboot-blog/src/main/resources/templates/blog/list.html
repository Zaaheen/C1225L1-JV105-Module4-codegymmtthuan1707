<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Bài Viết Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <!-- Header & Quản lý Danh mục Link -->
    <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h1 class="text-3xl font-bold text-gray-800">Blog Cá Nhân</h1>
        <div class="space-x-3">
            <a th:href="@{/categories}" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded shadow">
                📁 Quản Lý Danh Mục
            </a>
            <a th:href="@{/blogs/create}" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow">
                + Viết Bài Mới
            </a>
        </div>
    </div>

    <!-- Thông báo -->
    <div th:if="${message}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" th:text="${message}"></div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" th:text="${error}"></div>

    <!-- Thanh Tìm kiếm & Lọc theo Danh mục -->
    <form th:action="@{/blogs}" method="get" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-gray-50 p-4 rounded-lg border">
        <div class="md:col-span-2">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Nhập tiêu đề tìm kiếm..."
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <select name="categoryId" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">-- Tất cả danh mục --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${cat.id == selectedCategory}">
                </option>
            </select>
        </div>
        <div class="flex space-x-2">
            <button type="submit" class="w-full bg-indigo-600 text-white rounded px-4 py-2 hover:bg-indigo-700 font-medium">Lọc / Tìm kiếm</button>
            <a th:href="@{/blogs}" class="bg-gray-400 text-white rounded px-4 py-2 hover:bg-gray-500 font-medium text-center">Xóa</a>
        </div>
    </form>

    <!-- Danh sách bài viết -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div th:each="b : ${blogs.content}" class="border rounded-lg p-5 bg-gray-50 hover:shadow-lg transition flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-start mb-2">
                    <h2 class="text-xl font-bold text-blue-800" th:text="${b.title}">Tiêu đề bài viết</h2>
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded"
                          th:text="${b.category != null ? b.category.name : 'Chưa phân loại'}">Danh mục</span>
                </div>
                <p class="text-xs text-gray-500 mb-2">Tác giả: <span class="font-medium" th:text="${b.author}">Tác giả</span> | Ngày tạo: <span th:text="${#temporals.format(b.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                <p class="text-gray-700 mb-4 text-justify" th:text="${b.summary}">Nội dung tóm tắt...</p>
            </div>

            <div class="flex space-x-2 border-t pt-3 mt-auto">
                <a th:href="@{/blogs/view/{id}(id=${b.id})}" class="text-indigo-600 hover:text-indigo-900 font-medium text-sm">Xem chi tiết</a>
                <span class="text-gray-300">|</span>
                <a th:href="@{/blogs/edit/{id}(id=${b.id})}" class="text-amber-600 hover:text-amber-900 font-medium text-sm">Chỉnh sửa</a>
                <span class="text-gray-300">|</span>
                <a th:href="@{/blogs/delete/{id}(id=${b.id})}" onclick="return confirm('Bạn có chắc chắn muốn xóa bài viết này?')" class="text-red-600 hover:text-red-900 font-medium text-sm">Xóa</a>
            </div>
        </div>
    </div>

    <div th:if="${blogs.totalElements == 0}" class="text-center py-8 text-gray-500">
        Không tìm thấy bài viết nào phù hợp.
    </div>

    <!-- Điều hướng Phân Trang -->
    <div th:if="${blogs.totalPages > 1}" class="flex justify-between items-center border-t pt-4">
            <span class="text-sm text-gray-600">
                Trang <span class="font-semibold" th:text="${blogs.number + 1}"></span> / <span class="font-semibold" th:text="${blogs.totalPages}"></span> (Tổng <span th:text="${blogs.totalElements}"></span> bài viết)
            </span>
        <div class="inline-flex space-x-1">
            <a th:if="${blogs.hasPrevious()}"
               th:href="@{/blogs(page=${blogs.number - 1}, keyword=${keyword}, categoryId=${selectedCategory})}"
               class="px-3 py-1 border rounded bg-white text-gray-700 hover:bg-gray-100">Trang trước</a>

            <th:block th:each="i : ${#numbers.sequence(0, blogs.totalPages - 1)}">
                <a th:href="@{/blogs(page=${i}, keyword=${keyword}, categoryId=${selectedCategory})}"
                   th:text="${i + 1}"
                   th:classappend="${i == blogs.number} ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
                   class="px-3 py-1 border rounded font-medium">1</a>
            </th:block>

            <a th:if="${blogs.hasNext()}"
               th:href="@{/blogs(page=${blogs.number + 1}, keyword=${keyword}, categoryId=${selectedCategory})}"
               class="px-3 py-1 border rounded bg-white text-gray-700 hover:bg-gray-100">Trang sau</a>
        </div>
    </div>
</div>
</body>
</html>
