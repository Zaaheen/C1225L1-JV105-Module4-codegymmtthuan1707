<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Bài Viết Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Blog Cá Nhân</h1>
        <a th:href="@{/blogs/create}" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow">
            + Viết Bài Mới
        </a>
    </div>

    <!-- Thông báo thành công / thất bại -->
    <div th:if="${message}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
        <span th:text="${message}"></span>
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        <span th:text="${error}"></span>
    </div>

    <!-- Danh sách bài viết dạng card tóm tắt -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div th:each="b : ${blogs}" class="border rounded-lg p-5 bg-gray-50 hover:shadow-lg transition">
            <h2 class="text-xl font-bold text-blue-800 mb-2" th:text="${b.title}">Tiêu đề bài viết</h2>
            <p class="text-sm text-gray-500 mb-2">Tác giả: <span class="font-medium" th:text="${b.author}">Tác giả</span> | Ngày tạo: <span th:text="${#temporals.format(b.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
            <p class="text-gray-700 mb-4 text-justify" th:text="${b.summary}">Nội dung tóm tắt...</p>

            <div class="flex space-x-2 border-t pt-3">
                <a th:href="@{/blogs/view/{id}(id=${b.id})}" class="text-indigo-600 hover:text-indigo-900 font-medium text-sm">Xem chi tiết</a>
                <span class="text-gray-300">|</span>
                <a th:href="@{/blogs/edit/{id}(id=${b.id})}" class="text-amber-600 hover:text-amber-900 font-medium text-sm">Chỉnh sửa</a>
                <span class="text-gray-300">|</span>
                <a th:href="@{/blogs/delete/{id}(id=${b.id})}" onclick="return confirm('Bạn có chắc chắn muốn xóa bài viết này?')" class="text-red-600 hover:text-red-900 font-medium text-sm">Xóa</a>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(blogs)}" class="text-center py-8 text-gray-500">
        Chưa có bài viết nào. Hãy tạo bài viết đầu tiên!
    </div>
</div>
</body>
</html>
