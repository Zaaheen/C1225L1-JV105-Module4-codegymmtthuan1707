<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Bài Viết Mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Viết Bài Blog Mới</h1>

    <form th:action="@{/blogs/create}" th:object="${blog}" method="post" class="space-y-4">
        <div>
            <label class="block text-gray-700 font-medium mb-1">Danh mục:</label>
            <select th:field="*{category.id}" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500" required>
                <option value="">-- Chọn danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Tiêu đề:</label>
            <input type="text" th:field="*{title}" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Tác giả:</label>
            <input type="text" th:field="*{author}" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Tóm tắt:</label>
            <textarea th:field="*{summary}" rows="2" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500" required></textarea>
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Nội dung bài viết:</label>
            <textarea th:field="*{content}" rows="6" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500" required></textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-4">
            <a th:href="@{/blogs}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">Hủy bỏ</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Đăng bài</button>
        </div>
    </form>
</div>
</body>
</html>
