<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Bài Blog Mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Tạo Bài Viết Mới</h1>

    <form th:action="@{/blogs/create}" th:object="${blog}" method="post" class="space-y-4">
        <div>
            <label class="block font-medium text-gray-700">Tiêu đề:</label>
            <input type="text" th:field="*{title}" required class="w-full mt-1 p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Nhập tiêu đề...">
        </div>

        <div>
            <label class="block font-medium text-gray-700">Tác giả:</label>
            <input type="text" th:field="*{author}" required class="w-full mt-1 p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Tên tác giả...">
        </div>

        <div>
            <label class="block font-medium text-gray-700">Tóm tắt ngắn:</label>
            <textarea th:field="*{summary}" rows="3" required class="w-full mt-1 p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Đoạn tóm tắt hiển thị ngoài danh sách..."></textarea>
        </div>

        <div>
            <label class="block font-medium text-gray-700">Nội dung đầy đủ:</label>
            <textarea th:field="*{content}" rows="8" required class="w-full mt-1 p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Nội dung bài viết..."></textarea>
        </div>

        <div class="flex space-x-4 pt-4">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-md font-medium">Lưu Bài Viết</button>
            <a th:href="@{/blogs}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-5 py-2 rounded-md font-medium">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
