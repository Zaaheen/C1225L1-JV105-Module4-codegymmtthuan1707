<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh Sửa Danh Mục</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-xl font-bold mb-4 text-gray-800">Sửa Tên Danh Mục</h1>

    <form th:action="@{/categories/edit}" th:object="${category}" method="post" class="space-y-4">
        <input type="hidden" th:field="*{id}">
        <div>
            <label class="block text-gray-700 font-medium mb-1">Tên Danh Mục:</label>
            <input type="text" th:field="*{name}" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-purple-500" required>
        </div>
        <div class="flex justify-end space-x-2">
            <a th:href="@{/categories}" class="bg-gray-400 text-white px-3 py-2 rounded">Hủy</a>
            <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded">Cập nhật</button>
        </div>
    </form>
</div>
</body>
</html>
